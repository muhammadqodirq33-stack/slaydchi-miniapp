<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MY.HEMIS.UZ — Talaba Mini Ilovasi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" />
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('hemis_theme') || 'null');
        var tgDark = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme === 'dark';
        var dark = saved ? saved.color === 'dark' : tgDark;
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --brand: #1677ff;
      --brand-hover: #4096ff;
      --brand-active: #0958d9;
      --brand-soft: #e9f2ff;
      --brand-border: #bedaff;
      --brand-contrast: #ffffff;
      --success: #16c757;
      --success-soft: #e7f7ed;
      --warning: #d98204;
      --warning-soft: #fdf3e2;
      --danger: #dc2626;
      --danger-soft: #fdeced;
      --violet: #7a5fd2;
      --violet-soft: #f2eefc;
      --teal: #1ea58c;
      --teal-soft: #e6f7f4;
      --app-bg: #fbfbfb;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-sunken: #f7f8fa;
      --surface-hover: #f3f5f8;
      --surface-active: #eaeef5;
      --border: #e6eaf0;
      --border-strong: #d4dbe5;
      --text: #14181f;
      --text-secondary: #5a6475;
      --text-tertiary: #8c96a7;
      --shadow-sm: 0 1px 2px rgba(20, 24, 31, 0.04);
      --shadow-md: 0 6px 20px rgba(20, 24, 31, 0.06);
      --sidebar-w: 236px;
      --header-h: 58px;
      --radius: 12px;
      --radius-lg: 16px;
      --lab-glass: rgba(120, 152, 205, 0.14);
    }

    :root[data-theme="dark"] {
      --brand: #3b87f7;
      --brand-hover: #5c9dff;
      --brand-active: #1f6ad6;
      --brand-soft: #16233a;
      --brand-border: #23406b;
      --brand-contrast: #ffffff;
      --success: #3dd68c;
      --success-soft: #10261c;
      --warning: #f0b354;
      --warning-soft: #2a2013;
      --danger: #f4787b;
      --danger-soft: #2c1618;
      --violet: #a08cf0;
      --violet-soft: #211d36;
      --teal: #3cc7ab;
      --teal-soft: #112924;
      --app-bg: #0a0c10;
      --surface: #14171d;
      --surface-raised: #1a1e26;
      --surface-sunken: #101318;
      --surface-hover: #1e232c;
      --surface-active: #262c37;
      --border: #232934;
      --border-strong: #323a49;
      --text: #eef1f6;
      --text-secondary: #a3adbd;
      --text-tertiary: #737f91;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.35);
      --lab-glass: rgba(140, 170, 220, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--app-bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    button, input, select { font-family: inherit; color: inherit; }
    a { color: var(--brand); text-decoration: none; }

    /* Ambient Lab Background (my.hemis.uz style) */
    .lab-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(620px 340px at 10% -4%, var(--brand-soft), transparent 65%),
        radial-gradient(520px 300px at 96% 8%, var(--lab-glass), transparent 65%);
      opacity: 0.72;
    }

    /* App Shell */
    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar (Desktop >= 840px) */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 30;
    }
    .sidebar-brand {
      height: var(--header-h);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), #0958d9);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.02em;
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.25);
    }
    .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .brand-sub { font-size: 11px; color: var(--text-tertiary); display: block; margin-top: -2px; }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 24px;
    }
    .nav-group-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      padding: 12px 10px 6px;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-align: left;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
    }
    .nav-item .badge-ext {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      background: var(--surface-sunken);
      color: var(--text-tertiary);
      border: 1px solid var(--border);
    }

    /* Main Column */
    .main-col {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Header */
    .topbar {
      height: var(--header-h);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 25;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mobile-brand { display: none; align-items: center; gap: 8px; }
    .page-title-wrap { min-width: 0; }
    .page-title {
      font-size: 15.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-sub {
      font-size: 11.5px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar-chip {
      height: 36px;
      padding: 3px 10px 3px 4px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
    }
    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      font-weight: 700;
    }

    /* Main Content Area */
    .content-area {
      padding: 18px 20px 32px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
    }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }

    /* Hero Student Card */
    .hero-card {
      background: linear-gradient(135deg, #1677ff 0%, #0958d9 60%, #1d39c4 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(22, 119, 255, 0.24);
    }
    .hero-card::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
    .hero-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
    .hero-meta { font-size: 12.5px; opacity: 0.9; margin-top: 4px; }
    .hero-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; z-index: 1; }
    .hero-pill {
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      font-size: 11.5px;
      font-weight: 600;
    }

    /* Stat KPI */
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.14s, border-color 0.14s;
    }
    .kpi-card:hover { transform: translateY(-1px); border-color: var(--brand-border); }
    .kpi-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
    .kpi-val { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 11.5px; color: var(--text-tertiary); }

    /* Pills / Badges / Buttons */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .pill-brand { background: var(--brand-soft); color: var(--brand); }
    .pill-success { background: var(--success-soft); color: var(--success); }
    .pill-warning { background: var(--warning-soft); color: var(--warning); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .pill-violet { background: var(--violet-soft); color: var(--violet); }
    .pill-neutral { background: var(--surface-sunken); color: var(--text-secondary); border: 1px solid var(--border); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--brand); color: var(--brand-contrast); }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-ghost { background: var(--surface-sunken); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface-hover); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 25%, transparent); }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }

    /* Segmented Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 99px;
      background: var(--surface-sunken);
      overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

    /* List Row */
    .row-item {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-sunken);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .row-item + .row-item { margin-top: 8px; }

    /* Form Controls */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: 0;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px;
    }

    /* Menu Grid (Useful / Profile) */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .menu-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, transform 0.14s;
    }
    .menu-tile:hover { border-color: var(--brand-border); transform: translateY(-1px); }
    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .menu-tile-title { font-size: 13px; font-weight: 700; line-height: 1.25; }
    .menu-tile-sub { font-size: 11.5px; color: var(--text-tertiary); line-height: 1.3; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 11.5px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; background: var(--surface-sunken); }

    /* Radar banner */
    .radar-banner {
      border-radius: 14px;
      padding: 14px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 99px;
      background: var(--border-strong);
      border: 0;
      cursor: pointer;
      transition: background 0.18s;
      flex-shrink: 0;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.18s;
    }
    .switch.on { background: var(--brand); }
    .switch.on::after { transform: translateX(20px); }

    /* Mobile Bottom Nav */
    .bottom-nav {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 40;
      padding: 4px 6px env(safe-area-inset-bottom, 4px);
    }
    .bnav-btn {
      flex: 1;
      background: transparent;
      border: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-tertiary);
      cursor: pointer;
      border-radius: 10px;
    }
    .bnav-btn.active { color: var(--brand); }

    /* Toast & Status Banner */
    .toast {
      position: fixed;
      top: 68px;
      right: 16px;
      z-index: 90;
      background: var(--text);
      color: var(--surface);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      max-width: 320px;
      display: none;
    }
    .toast.show { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .offline-bar {
      margin-bottom: 12px;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12px;
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid color-mix(in srgb, var(--warning) 25%, transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .empty-box {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-tertiary);
      font-size: 13.5px;
    }

    .login-wrap {
      max-width: 440px;
      margin: 18px auto;
    }

    @media (max-width: 839px) {
      .sidebar { display: none; }
      .main-col { margin-left: 0; padding-bottom: 72px; }
      .mobile-brand { display: flex; }
      .page-title-wrap { display: none; }
      .topbar { padding: 0 12px; }
      .content-area { padding: 12px 12px 24px; }
      .bottom-nav { display: flex; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .avatar-name-text { display: none; }
    }
  </style>
</head>
<body>
  <div class="lab-bg"></div>
  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">H</div>
        <div>
          <div class="brand-title">MY.HEMIS.UZ</div>
          <span class="brand-sub" id="sidebarSub">Talaba kabineti</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <!-- Main Column -->
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-left">
          <div class="mobile-brand" data-nav="dashboard" style="cursor:pointer;">
            <div class="brand-logo" style="width:30px;height:30px;font-size:12px;">H</div>
            <div>
              <div style="font-weight:800;font-size:14px;line-height:1.1;">MY.HEMIS.UZ</div>
              <span style="font-size:10.5px;color:var(--text-tertiary);" id="mobileUniLabel">Talaba tizimi</span>
            </div>
          </div>
          <div class="page-title-wrap">
            <div class="page-title" id="headerTitle">Bosh sahifa</div>
            <div class="page-sub" id="headerSub">Oliy ta'lim jarayonlarini boshqarish tizimi</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="refreshBtn" data-act="refresh" title="Yangilash">

      try {

        const isLocal = u.hostname === 'localhost' || u.hostname === '127.0.0.1';
        if (u.protocol === 'https:' || (u.protocol === 'http:' && isLocal)) {
          return (u.origin + u.pathname).replace(/\/+$/, '');
        }
      } catch (e) {}
      return '';

    // Snapshot #d=z:... decoder
    async function decodeUrlSnapshot() {
      const hash = window.location.hash || '';
      const m = hash.match(/d=([^&]+)/);
      if (!m) return null;
      let rawStr = decodeURIComponent(m[1]);
      if (rawStr.startsWith('z:')) rawStr = rawStr.slice(2);
      const b64 = rawStr.replace(/-/g, '+').replace(/_/g, '/');
      const pad = '='.repeat((4 - b64.length % 4) % 4);
      const bin = atob(b64 + pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (typeof DecompressionStream !== 'undefined') {
        const ds = new DecompressionStream('deflate');
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const text = await new Response(ds.readable).text();
        return JSON.parse(text);
      }
      return null;
    }

    async function apiCall(path, opts = {}) {
      if (!API_BASE) throw new Error('NO_API');
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (INIT_DATA) headers['X-Telegram-Init-Data'] = INIT_DATA;
      if (UID) headers['X-WebApp-Uid'] = UID;
      if (SIG) headers['X-WebApp-Sig'] = SIG;
      const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
      state.liveApi = true;
      return json;
    }

    function isNetworkError(err) {
      const msg = String(err?.message || '');
      return msg === 'NO_API' || err?.name === 'TypeError' || /Failed to fetch|Load failed|NetworkError|fetch/i.test(msg);
    }

      if (tg && tg.sendData) {

    function resolveRadar() {
      const { wd, minutes: nowM } = getTashkentClock();
      if (state.radar && state.radar.status && Number(state.radar.weekday) === wd) {
        const sr = state.radar;
        const target = sr.current_lesson || sr.next_lesson || sr.first_lesson || null;
        return {
          status: sr.status,
          lessons: sr.lessons_today || state.schedule[wd] || state.schedule[String(wd)] || [],
          target,
          left: Number(sr.left_min ?? 0),
        };
      }
      const lessons = (state.schedule[wd] || state.schedule[String(wd)] || []).slice();
      if (!lessons.length || wd === 7) return { status: 'day_off', lessons: [] };
      const toMin = (hhmm) => {
        const [h, m] = String(hhmm || '00:00').split(':').map(Number);
        return (h || 0) * 60 + (m || 0);
      };
      lessons.sort((a, b) => toMin(a.start_time) - toMin(b.start_time));
      const firstS = toMin(lessons[0].start_time);
      const lastE = toMin(lessons[lessons.length - 1].end_time);
      if (nowM < firstS) return { status: 'before_classes', lessons, target: lessons[0], left: Math.max(1, firstS - nowM) };
      if (nowM > lastE) return { status: 'after_classes', lessons };
      for (let i = 0; i < lessons.length; i++) {
        const cur = lessons[i];
        const s = toMin(cur.start_time), e = toMin(cur.end_time);
        if (nowM >= s && nowM <= e) return { status: 'in_class', lessons, target: cur, left: Math.max(0, e - nowM) };
        if (i < lessons.length - 1) {
          const nxt = lessons[i + 1];
          const ns = toMin(nxt.start_time);
          if (nowM > e && nowM < ns) return { status: 'in_break', lessons, target: nxt, left: Math.max(1, ns - nowM) };
        }
      }
      return { status: 'after_classes', lessons };
    }

        if (page === 'eduplan' && !state.ui.loadedSections.eduplan) loadSection('eduplan');
        if (page === 'services') {

          if (!state.ui.loadedSections.documents) loadSection('documents');

        if (page === 'subjects' && !state.ui.loadedSections.subject_detail) loadSection('subject_detail');

        loadLibrary(state.ui.libQuery || '');
      }

    async function handleLoginSubmit(ev) {
      ev.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('pwdInput').value;
      const errBox = document.getElementById('loginErr');
      const submitBtn = document.getElementById('loginSubmitBtn');
      if (!login || !password) {
        errBox.textContent = t('loginFillErr');
        errBox.style.display = 'block';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '...';
      errBox.style.display = 'none';
      if (API_BASE) {
        try {
          const res = await apiCall('/api/login', {
            method: 'POST',
            body: JSON.stringify({ login, password, lang: state.lang })
          });
          applyBootstrapPayload(res);
          state.ui.showLoginModal = false;
          state.page = 'dashboard';
          showToast(t('loginOk'));
          render();
          return;
        } catch (e) {
          if (!isNetworkError(e)) {
            errBox.textContent = e.message;
            errBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = t('signIn');
            return;
          }
        }
      }
      const sent = sendToBot({ action: 'login', login, password, lang: state.lang });
      if (!sent) {
        submitBtn.disabled = false;
        submitBtn.textContent = t('signIn');
      }
    }

    async function updateSetting(patch) {
      state.settings = { ...state.settings, ...patch };
      if (patch.language && ['uz', 'ru', 'en'].includes(patch.language)) state.lang = patch.language;
      if (!state.liveApi && !API_BASE) state.ui.settingsDirty = true;
      render();
      if (state.liveApi || API_BASE) {

          const res = await apiCall('/api/settings', { method: 'POST', body: JSON.stringify(patch) });

          render();

        } catch (e) {

        }
      }
      state.ui.settingsDirty = true;
      render();
    }

    async function toggleMuteSubject(subj) {
      if (!subj) return;
      const m = new Set(state.settings.muted || []);
      if (m.has(subj)) m.delete(subj); else m.add(subj);
      state.settings.muted = Array.from(m);
      if (!state.liveApi && !API_BASE) state.ui.settingsDirty = true;
      render();
      if (state.liveApi || API_BASE) {
        try {
          await apiCall('/api/settings', { method: 'POST', body: JSON.stringify({ toggle_mute: subj }) });
          state.ui.settingsDirty = false;
          showToast(t('updatedToast'));
          return;
        } catch (e) {
          if (!isNetworkError(e)) {
            showToast(e.message);
            return;
          }
        }
      }
      state.ui.settingsDirty = true;
      render();
    }

    function flushOfflineSettings() {
      sendToBot({ action: 'save_settings', settings: state.settings });
    }

    function attThresholds() {
      return {
        warn: Number(state.settings.att_warning ?? 12),
        crit: Number(state.settings.att_critical ?? 20),
        limit: Number(state.settings.att_limit ?? 25),
      };
    }

    function attColor(pct) {
      if (pct === null || pct === undefined) return 'var(--text-tertiary)';
      const th = attThresholds();
      if (pct >= th.crit) return 'var(--danger)';
      if (pct >= th.warn) return 'var(--warning)';
      return 'var(--success)';
    }

    function renderSubjects() {
      const tab = state.ui.subjTab;
      const semKeys = Object.keys(state.grades || {});
      const curSem = state.ui.selectedSem && state.grades[state.ui.selectedSem] ? state.ui.selectedSem : (semKeys[semKeys.length - 1] || '');

      let body = '';
      if (tab === 'daily') {
        const mode = state.ui.dailyMode;
        const dg = state.dailyGrades || [];
        let listHtml = '';
        if (!dg.length) {
          listHtml = `<div class="card empty-box">${esc(t('noData'))}</div>`;
        } else if (mode === 'subject') {
          const bySubj = {};
          dg.forEach(g => { (bySubj[g.subject] = bySubj[g.subject] || []).push(g); });
          listHtml = Object.entries(bySubj).map(([subj, items]) => {
            const nums = items.map(x => Number(x.grade_num)).filter(n => !Number.isNaN(n));
            const avg = nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : '-';
            return `
              <div class="card" data-open-subj="${esc(subj)}" style="cursor:pointer;">
                <div class="card-title"><span style="color:var(--brand);">${esc(subj)} (${items.length}) →</span><span class="pill pill-brand">${esc(t('avgWord'))}: ${esc(avg)}</span></div>
                ${items.slice(0, 8).map(g => `
                  <div class="row-item">
                    <div style="font-size:12.5px;color:var(--text-secondary);">${esc(g.lesson_date)} • ${esc(g.type)} ${g.pair ? '• ' + esc(g.pair) : ''}</div>
                    <span class="pill pill-success">${esc(g.grade)}</span>
                  </div>
                `).join('')}
              </div>
            `;
          }).join('');
        } else {
          listHtml = `<div class="card">${dg.slice(0, 30).map(g => `
            <div class="row-item" data-open-subj="${esc(g.subject)}" style="cursor:pointer;">
              <div>
                <div style="font-weight:700;color:var(--brand);">${esc(g.subject)} →</div>
                <div style="font-size:11.5px;color:var(--text-secondary);">${esc(g.lesson_date)} • ${esc(g.type)} • ${esc(g.teacher || '')}</div>
              </div>
              <span class="pill pill-success" style="font-size:13px;">${esc(g.grade)}</span>
            </div>
          `).join('')}</div>`;
        }
        body = `
          <div style="display:flex;gap:8px;margin-bottom:10px;">
            <button type="button" class="btn btn-sm ${mode === 'recent' ? 'btn-primary' : 'btn-ghost'}" data-act="set-daily-mode" data-val="recent">${esc(t('recent'))}</button>
            <button type="button" class="btn btn-sm ${mode === 'subject' ? 'btn-primary' : 'btn-ghost'}" data-act="set-daily-mode" data-val="subject">${esc(t('bySubject'))}</button>
          </div>
          <div class="stack">${listHtml}</div>
        `;
      } else if (tab === 'perf') {
        const list = state.grades[curSem] || [];
        body = `
          ${semKeys.length ? `<div class="tabs">${semKeys.map(s => `<button type="button" class="tab-btn ${curSem === s ? 'active' : ''}" data-act="set-sem" data-val="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
          <div class="card">
            ${list.length ? `
              <div class="table-wrap"><table>
                <thead><tr><th>${esc(t('thSubj'))}</th><th>JN</th><th>ON</th><th>YN</th><th>${esc(t('thTotal'))}</th></tr></thead>
                <tbody>${list.map(x => {
                  const subInfo = collectSubjectDetails(x.subject, curSem);
                  const gCnt = subInfo.dailyGrades.length;
                  const gAvg = subInfo.avgDaily;
                  return `
                  <tr data-open-subj="${esc(x.subject)}" data-open-sem="${esc(curSem)}" style="cursor:pointer;">
                    <td>
                      <div style="font-weight:700;color:var(--brand);">${esc(x.subject)} →</div>
                      ${gCnt ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">📝 ${gCnt} ta kunlik baho${gAvg ? ' • ' + esc(t('avgWord')) + ': ' + esc(gAvg) : ''}</div>` : ''}
                    </td>
                    <td>${esc(x.jn)}</td><td>${esc(x.on)}</td><td>${esc(x.yn)}</td>
                    <td><span class="pill pill-brand">${esc(x.total)}</span></td>
                  </tr>
                `;
                }).join('')}</tbody>
              </table></div>
            ` : `<div class="empty-box">${esc(t('noData'))}</div>`}
          </div>
        `;
      } else {
        const allTasks = state.subjectDetail.tasks || [];
        const allResources = state.subjectDetail.resources || [];
        const subjNames = Array.from(new Set([...allTasks.map(x => x.subject), ...allResources.map(x => x.subject)].filter(Boolean)));
        const sf = state.ui.subjFilter || '';
        const tasks = sf ? allTasks.filter(x => x.subject === sf) : allTasks;
        const resources = sf ? allResources.filter(x => x.subject === sf) : allResources;
        body = `
          ${subjNames.length ? `
            <div class="card" style="padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
              <span style="font-size:12.5px;font-weight:700;color:var(--text-secondary);">${esc(t('filterSubj'))}:</span>
              <select class="input" data-change="subj-filter" style="height:36px;max-width:280px;">
                <option value="">${esc(tf('allSubjsCount', { n: allResources.length }))}</option>
                ${subjNames.map(n => `<option value="${esc(n)}" ${sf === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}
              </select>
            </div>
          ` : ''}
          <div class="grid-2">
            <div class="card">
              <div class="card-title"><span>${esc(t('tasks'))}</span><span class="pill pill-brand">${tasks.length}</span></div>
              ${tasks.length ? tasks.map(tk => `
                <div class="row-item" style="align-items:flex-start;">
                  <div>
                    <div style="font-weight:700;">${esc(tk.name)}</div>
                    <div style="font-size:12px;color:var(--text-secondary);">${esc(tk.subject)} • ${esc(t('deadline'))}: ${esc(tk.deadline)}</div>
                  </div>
                  <span class="pill ${tk.submitted ? 'pill-success' : 'pill-warning'}">${esc(tk.mark)} / ${esc(tk.max_ball)}</span>
                </div>
              `).join('') : `<div class="empty-box">${esc(t('noData'))}</div>`}
            </div>
            <div class="card">
              <div class="card-title"><span>${esc(t('resources'))}</span><span class="pill pill-violet">${resources.length}</span></div>
              ${resources.slice(0, 60).map(rs => `
                <div class="row-item" style="align-items:flex-start;">
                  <div style="min-width:0;">
                    <div style="font-weight:700;">${esc(rs.name)}</div>
                    <div style="font-size:12px;color:var(--text-secondary);">${esc(rs.subject)} • ${esc(rs.training_type)}${rs.teacher ? ' • ' + esc(rs.teacher) : ''}</div>
                    ${(rs.files || []).map(f => `<div style="margin-top:4px;"><button type="button" class="btn btn-sm btn-ghost" data-external="${esc(f.url)}">📎 ${esc(f.name)}</button></div>`).join('')}
                  </div>
                </div>
              `).join('') || `<div class="empty-box">${esc(t('noData'))}</div>`}
            </div>
          </div>
        `;
      }

      return `
        <div class="stack">
          <div class="tabs">
            <button type="button" class="tab-btn ${tab === 'daily' ? 'active' : ''}" data-act="set-subj-tab" data-val="daily">${esc(t('dailyGrades'))}</button>
            <button type="button" class="tab-btn ${tab === 'perf' ? 'active' : ''}" data-act="set-subj-tab" data-val="perf">${esc(t('performance'))}</button>
            <button type="button" class="tab-btn ${tab === 'res' ? 'active' : ''}" data-act="set-subj-tab" data-val="res">${esc(t('resourcesTasks'))}</button>
          </div>
          ${body}
        </div>
      `;
    }

    function normSubj(s) {
      return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function collectSubjectDetails(subjName, semHint = '') {
      const key = normSubj(subjName);
      let semEntry = null;
      let resolvedSem = semHint || '';
      const allSems = state.grades || {};
      if (semHint && Array.isArray(allSems[semHint])) {
        semEntry = allSems[semHint].find(x => normSubj(x.subject) === key) || null;
      }
      if (!semEntry) {
        for (const [sName, arr] of Object.entries(allSems).reverse()) {
          const hit = (arr || []).find(x => normSubj(x.subject) === key);
          if (hit) {
            semEntry = hit;
            resolvedSem = resolvedSem || sName;
            break;
          }
        }
      }

      let eduEntry = null;
      const eduSems = (state.eduplan && state.eduplan.semesters) || {};
      if (resolvedSem && Array.isArray(eduSems[resolvedSem])) {
        eduEntry = eduSems[resolvedSem].find(x => normSubj(x.subject) === key) || null;
      }
      if (!eduEntry) {
        for (const [sName, arr] of Object.entries(eduSems).reverse()) {
          const hit = (arr || []).find(x => normSubj(x.subject) === key);
          if (hit) {
            eduEntry = hit;
            resolvedSem = resolvedSem || sName;
            break;
          }
        }
      }

      const rawDaily = [
        ...((semEntry && Array.isArray(semEntry.grades)) ? semEntry.grades : []),
        ...((eduEntry && Array.isArray(eduEntry.grades)) ? eduEntry.grades : []),
        ...(state.dailyGrades || []).filter(g => normSubj(g.subject) === key && (!semHint || !g.semester || g.semester === semHint)),
      ];
      const seenIds = new Set();
      const dailyGrades = [];
      for (const g of rawDaily) {
        if (!g || typeof g !== 'object') continue;
        const k = String(g.id || `${g.lesson_date}|${g.pair}|${g.grade}|${g.type}`);
        if (seenIds.has(k)) continue;
        seenIds.add(k);
        dailyGrades.push(g);
      }

      const nums = dailyGrades.map(x => Number(x.grade_num ?? x.grade)).filter(n => !Number.isNaN(n));
      const avgDaily = nums.length
        ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1).replace(/\.0$/, '')
        : ((semEntry && semEntry.avg_daily) || (eduEntry && eduEntry.avg_daily) || '');

      const attRow = (state.attendance.report || []).find(r => normSubj(r.subject) === key) || null;
      const missedLogs = (state.attendance.recent || []).filter(r => normSubj(r.subject) === key);
      const resources = ((state.subjectDetail && state.subjectDetail.resources) || []).filter(r => normSubj(r.subject) === key);
      const tasks = ((state.subjectDetail && state.subjectDetail.tasks) || []).filter(r => normSubj(r.subject) === key);

      return {
        subject: (semEntry && semEntry.subject) || (eduEntry && eduEntry.subject) || subjName,
        semester: resolvedSem,
        jn: (semEntry && semEntry.jn) || (eduEntry && eduEntry.jn) || '0',
        on: (semEntry && semEntry.on) || (eduEntry && eduEntry.on) || '0',
        yn: (semEntry && semEntry.yn) || (eduEntry && eduEntry.yn) || '0',
        total: (semEntry && semEntry.total) || (eduEntry && eduEntry.total) || '0',
        credit: (eduEntry && eduEntry.credit) || '',
        totalAcload: (eduEntry && eduEntry.total_acload) || '',
        examFinish: (eduEntry && (eduEntry.exam_finish || eduEntry.subject_type)) || '',
        avgDaily,
        dailyGrades,
        attRow,
        missedLogs,
        resources,
        tasks,
      };
    }

            </div>
          ` : ''}
        </div>
      `;
    }

    function render() {
      renderChrome();
      const root = document.getElementById('appRoot');
      if (state.loading) {
        root.innerHTML = `<div class="card empty-box">${esc(t('loading'))}</div>`;
        return;
      }
      if (!state.authenticated || state.ui.showLoginModal) {
        root.innerHTML = renderLoginView();
        return;
      }
      if (state.ui.modalSubject && state.ui.modalSubject.name) {
        root.innerHTML = renderSubjectModal();
        return;
      }
      const views = {
        dashboard: renderDashboard,
        timetable: renderTimetable,
        attendance: renderAttendance,
        subjects: renderSubjects,
        eduplan: renderEduplan,
        exams: renderExams,
        payment: renderPayment,
        services: renderServices,
        library: renderLibrary,
        useful: renderUseful,
        profile: renderProfile,
        settings: renderSettings,
      };
      root.innerHTML = (views[state.page] || renderDashboard)();
    }

    document.addEventListener('click', (ev) => {
      const target = ev.target instanceof Element ? ev.target : null;
      if (!target) return;
      const navEl = target.closest('[data-nav]');
      if (navEl) {
        state.ui.modalSubject = null;
        navTo(navEl.dataset.nav);
        return;
      }
      const extEl = target.closest('[data-external]');
      if (extEl) {
        openExternal(extEl.dataset.external);
        return;
      }
      const dlEl = target.closest('[data-dl-file], [data-dl-link]');
      if (dlEl) {
        downloadHemisDoc(dlEl.dataset.dlFile || '', dlEl.dataset.dlLink || '');
        return;
      }
      const subjEl = target.closest('[data-open-subj]');
      if (subjEl) {
        openSubjectModal(subjEl.dataset.openSubj || '', subjEl.dataset.openSem || '');
        return;
      }
      const actEl = target.closest('[data-act]');
      if (!actEl) return;
      const act = actEl.dataset.act;
      if (act === 'close-subj-modal') {
        state.ui.modalSubject = null;
        render();
        return;
      }
      if (act === 'refresh') forceRefresh();
      else if (act === 'cycle-lang') cycleLanguage();
      else if (act === 'toggle-theme') toggleTheme();
      else if (act === 'toggle-pwd') {
        const p = document.getElementById('pwdInput');
        if (p) p.type = p.type === 'password' ? 'text' : 'password';
      } else if (act === 'close-login') {
        state.ui.showLoginModal = false;
        render();
      } else if (act === 'open-login') {
        state.ui.showLoginModal = true;
        render();
      } else if (act === 'set-day') {
        state.ui.day = Number(actEl.dataset.val) || 1;
        render();
      } else if (act === 'set-att-tab') {
        state.ui.attTab = actEl.dataset.val || 'subject';
        render();
      } else if (act === 'set-subj-tab') {
        const v = actEl.dataset.val || 'daily';
        state.ui.subjTab = v;
        render();
        if (v === 'res' && API_BASE && state.authenticated && !state.ui.loadedSections.subject_detail) {
          loadSection('subject_detail');
        }
      } else if (act === 'set-daily-mode') {
        state.ui.dailyMode = actEl.dataset.val || 'recent';
        render();
      } else if (act === 'set-sem') {
        state.ui.selectedSem = actEl.dataset.val || '';
        render();
      } else if (act === 'set-pay-tab') {
        state.ui.payTab = actEl.dataset.val || 'contract';
        render();
      } else if (act === 'set-srv-tab') {
        state.ui.srvTab = actEl.dataset.val || 'documents';
        render();
      } else if (act === 'scan-qr') {
        triggerQrScan();
      } else if (act === 'submit-qr') {
        const inp = document.getElementById('qrManualInput');
        handleQrSubmit(inp ? inp.value.trim() : '');
      } else if (act === 'search-lib') {
        const inp = document.getElementById('libInput');
        loadLibrary(inp ? inp.value.trim() : '');
      } else if (act === 'request-pdf') {
        requestPdfReport();
      } else if (act === 'logout') {
        handleLogout();
      } else if (act === 'toggle-bool') {
        const k = actEl.dataset.key;
        if (['notifications_enabled', 'daily_enabled', 'weekly_enabled'].includes(k)) {
          updateSetting({ [k]: state.settings[k] ? 0 : 1 });
        }
      } else if (act === 'set-time') {
        updateSetting({ report_time: actEl.dataset.val });
      } else if (act === 'set-thr') {
        updateSetting({ alert_threshold: Number(actEl.dataset.val) });
      } else if (act === 'toggle-mute') {
        toggleMuteSubject(actEl.dataset.subj || '');
      } else if (act === 'save-offline-settings') {
        flushOfflineSettings();
      }
    });

    document.addEventListener('change', (ev) => {
      const el = ev.target instanceof Element ? ev.target : null;
      if (!el || !el.dataset.change) return;
      if (el.dataset.change === 'week') {
        state.ui.selectedWeekId = el.value;
        render();
      } else if (el.dataset.change === 'subj-filter') {
        state.ui.subjFilter = el.value;
        render();
      }
    });

    document.addEventListener('submit', (ev) => {
      if (ev.target && ev.target.id === 'loginForm') handleLoginSubmit(ev);
    });

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && ev.target && ev.target.id === 'libInput') {
        loadLibrary(ev.target.value.trim());
      }
    });

    document.addEventListener('error', (ev) => {
      if (ev.target && ev.target.tagName === 'IMG') ev.target.style.display = 'none';
    }, true);

    async function init() {
      try {
        const snap = await decodeUrlSnapshot();
        if (snap) applySnapshotData(snap);
      } catch (e) {}
      render();

      if (API_BASE && (INIT_DATA || (UID && SIG))) {
        try {
          const data = await apiCall('/api/bootstrap');
          state.apiError = '';
          applyBootstrapPayload(data);
          render();
        } catch (e) {
          state.apiError = e.message || 'API error';
          render();
        }
      }
    }

    init();
  </script>
</body>
</html>
